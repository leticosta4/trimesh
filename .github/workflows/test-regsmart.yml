name: Tests regsmart

on:
  push:
    branches:
      - '!main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@f64ccc5c05f30b5b369f8c92c53bb06e9ef79bb4"

jobs:
  tests:
    name: regsmart (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: rgsm_qtf
            weight: "1-0"
          - mode: rgsm_recentfail
            weight: "0-1"
          - mode: rgsm_hybrid
            weight: "1-1"
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.13"
    - name: Test a minimal install
      run: |
        pip install --no-cache-dir .
        python tests/test_minimal.py
    - name: Install Trimesh
      run: pip install --no-cache-dir .[easy,test]
    - name: Install pytest-regsmart
      run: |
        pip install "$REGSMART_PACKAGE"
        pip freeze
    - name: Install reportlog
      run: pip install pytest-reportlog
    - name: Restore pytest-regsmart cache
      id: restore-pytest-regsmart-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
        key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}
        restore-keys: |
          pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-
    - name: Run pytest-regsmart
      run: |
        pytest --report-log=reportlog.jsonl --regsmart --ranking-weight=${{ matrix.weight }} 
    - name: Save pytest-regsmart cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
        key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-${{ github.run_id }}
    - name: Upload report-log
      if: ${{ !cancelled() }} # com mutante o step de teste falha; sem isso o arquivo não sobe
      uses: actions/upload-artifact@v4
      with:
        name: reportlog-${{ matrix.mode }}
        path: reportlog.jsonl
        retention-days: 14
        if-no-files-found: warn

