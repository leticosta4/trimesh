name: Tests regsmart no-rtp

on:
  push:
    branches:
      - '!main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@71e176c9c867760a6abd5d4fa1a8efc81486bbcd"

jobs:
  tests-regsmart-nr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.13"
    - name: Test a minimal install
      run: |
        pip install --no-cache-dir .
        python tests/test_minimal.py
    - name: Install Trimesh
      run: pip install --no-cache-dir .[easy,test]
    - name: Install pytest-regsmart
      run: |
        pip install "$REGSMART_PACKAGE"
        pip freeze
    - name: Install reportlog
      run: pip install pytest-reportlog
    - name: Run pytest-regsmart
      run: |
        pytest --report-log=reportlog.jsonl --regsmart --no-rank 
    - name: Upload report-log
      if: ${{ !cancelled() }} # com mutante o step de teste falha; sem isso o arquivo não sobe
      uses: actions/upload-artifact@v4
      with:
        name: reportlog-regsmart-nr
        path: reportlog.jsonl
        retention-days: 14
        if-no-files-found: warn

